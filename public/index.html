<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dog Breed Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div style="margin-bottom: 20px;">
    <button onclick="loadBreeds()">Show Breeds</button>
    <button onclick="loadGroups()">Show Groups</button>
    <button onclick="loadFacts()">Show Facts</button>
</div>

<div id="list-container">
    <h2>Dog Breeds</h2>
    <ul id="breed-list">
        <li>Loading the pack...</li>
    </ul>
</div>

<div id="details-container">
    <div id="breed-content">
        <h2>Select a Breed</h2>
        <p>Click a name on the left to see the description.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
